<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>카카오맵 연동</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fc4fce66251ca9a743c7ca1fd266d88c&libraries=services"></script>
    <style>
      html, body, #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      let map;
      let markers = [];

      function initMap(markerData) {
        if (!markerData || markerData.length === 0) {
          const defaultPosition = new kakao.maps.LatLng(37.5666805, 126.9784147);
          map = new kakao.maps.Map(document.getElementById("map"), {
            center: defaultPosition,
            level: 4,
          });
          return;
        }

        const centerLatLng = markerData.find(m => m.name === "현재 위치")
          ? new kakao.maps.LatLng(
              markerData.find(m => m.name === "현재 위치").lat,
              markerData.find(m => m.name === "현재 위치").lng
            )
          : new kakao.maps.LatLng(markerData[0].lat, markerData[0].lng);

        map = new kakao.maps.Map(document.getElementById("map"), {
          center: centerLatLng,
          level: 4,
        });

        // 기존 마커 제거
        markers.forEach(m => m.setMap(null));
        markers = [];

        // 마커 표시
        markerData.forEach((marker) => {
          const position = new kakao.maps.LatLng(marker.lat, marker.lng);
          const markerObj = new kakao.maps.Marker({
            position: position,
            map: map,
          });

          const infowindow = new kakao.maps.InfoWindow({
            content: `<div style="padding:5px;font-size:14px;"><strong>${marker.name}</strong><br/>${marker.address || ''}</div>`,
          });

          kakao.maps.event.addListener(markerObj, "click", function () {
            infowindow.open(map, markerObj);
          });

          markers.push(markerObj);
        });
      }

      // React Native → WebView 메시지 수신
      const handleMessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          initMap(data);
        } catch (e) {
          alert("마커 데이터 파싱 오류");
          console.error("Error parsing marker data:", e);
        }
      };

      // 메시지 리스너 등록
      document.addEventListener("message", handleMessage);   // Android
      window.addEventListener("message", handleMessage);     // iOS
    </script>
  </body>
</html>
